services:
  web:
    build:
      context: ./web
    env_file:
      - ./web/.env
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      WEB_ORIGIN: "http://localhost:${WEB_PORT:-5173}"
      CONFIG_DIR: /app/config
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-dfpmp}
      POSTGRES_USER: ${POSTGRES_USER:-dfpmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in api/.env before starting Docker}
      AUTH_MODE: ${AUTH_MODE:-preview}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - ./api/config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfpmp}
      POSTGRES_USER: ${POSTGRES_USER:-dfpmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in api/.env before starting Docker}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data

volumes:
  postgres-data:

networks:
  app:
  data:
    internal: true
